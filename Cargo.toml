[package]
name = "solana-rfc6979"
authors = ["Dean Little <@deanmlittle>"]
description = "A more efficient, no_std implementation of RFC 6979 deterministic nonce generation for the Solana SVM"
license = "MIT"
version = "0.3.0"
edition = "2024"
repository = "https://github.com/blueshift-gg/solana-rfc6979"
readme = "Readme.md"
keywords = ["solana", "sbpf", "rfc6979", "ecdsa", "no-std"]
categories = ["cryptography", "no-std"]
exclude = [".github/", ".gitignore"]

[lib]

[features]
# Transparently forwards to `solana-hmac-drbg/static-syscalls` (which in
# turn forwards to `solana-hmac-sha256/static-syscalls`). Use the Upstream
# BPF / sBPFv3 static-syscall ABI instead of dynamic `extern "C"` linking.
# Requires a toolchain that supports static syscalls.
static-syscalls = ["solana-hmac-drbg/static-syscalls"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dependencies]
solana-hmac-drbg = "0.2.0"

[dev-dependencies]
svm-unit-test = "0.1.5"
